<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Worst-case coefficient-norm bounds versus replacement-noise rate</title>
  <desc id="desc">The universal upper bound and the exact aligned-family lower bound both start at 3. The aligned-family curve reaches 1 at one minus one over square root of three, while the universal upper bound reaches 1 at four ninths.</desc>
